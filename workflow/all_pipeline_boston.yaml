# PIPELINE DEFINITION
# Name: all-pipeline-boston
components:
  comp-census-collector-component:
    executorLabel: exec-census-collector-component
  comp-development-plans-collector-component:
    executorLabel: exec-development-plans-collector-component
  comp-development-plans-label-studio-processor-component:
    executorLabel: exec-development-plans-label-studio-processor-component
deploymentSpec:
  executors:
    exec-census-collector-component:
      container:
        command:
        - sh
        - -c
        - export GCS_BUCKET_NAME=spatially-data && export GCP_PROJECT=spatially-476017
          && /home/app/.venv/bin/python /app/census/run.py --city 'boston' --type
          population --level tract --year 2020
        image: us-central1-docker.pkg.dev/spatially-476017/workflow-images/data-collector:latest
        resources:
          cpuLimit: 1.0
          memoryLimit: 4.0
          resourceCpuLimit: 1000m
          resourceMemoryLimit: 4G
    exec-development-plans-collector-component:
      container:
        command:
        - sh
        - -c
        - export GCS_BUCKET_NAME=spatially-data && export GCP_PROJECT=spatially-476017
          && /home/app/.venv/bin/python /app/development_plans/run.py --city 'boston'
        image: us-central1-docker.pkg.dev/spatially-476017/workflow-images/data-collector:latest
        resources:
          cpuLimit: 2.0
          memoryLimit: 8.0
          resourceCpuLimit: 2000m
          resourceMemoryLimit: 8G
    exec-development-plans-label-studio-processor-component:
      container:
        command:
        - sh
        - -c
        - export GCS_BUCKET_NAME=spatially-data && export GCP_PROJECT=spatially-476017
          && /home/app/.venv/bin/python /app/development_plans_label_studio/run.py
          --city 'boston'
        image: us-central1-docker.pkg.dev/spatially-476017/workflow-images/data-processor:latest
        resources:
          cpuLimit: 1.0
          memoryLimit: 4.0
          resourceCpuLimit: 1000m
          resourceMemoryLimit: 4G
pipelineInfo:
  name: all-pipeline-boston
root:
  dag:
    tasks:
      census-collector-component:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-census-collector-component
        taskInfo:
          name: collector-census-boston
      development-plans-collector-component:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-development-plans-collector-component
        taskInfo:
          name: collector-development-plans-boston
      development-plans-label-studio-processor-component:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-development-plans-label-studio-processor-component
        dependentTasks:
        - development-plans-collector-component
        taskInfo:
          name: processor-development-plans-label-studio-boston
schemaVersion: 2.1.0
sdkVersion: kfp-2.14.6
