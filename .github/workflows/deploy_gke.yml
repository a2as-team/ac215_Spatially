name: Build and Deploy to GKE

on:
  push:
    branches:
      - prod  # Deploy on push to prod
    paths:
      - 'backend/**'
      - 'workflow/deploy/**'
      - '.github/workflows/deploy.yml'
  # Manual trigger
  workflow_dispatch:
    inputs:
      skip_ingress:
        description: 'Skip ingress setup (faster for updates)'
        required: false
        default: false
        type: boolean

env:
  GCP_REGION: us-central1
  GKE_ZONE: us-central1-a

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Build the workflow Docker image
    - name: Build Workflow Image
      run: |
        docker build \
          --build-context shared_config=./shared_config \
          -t workflow:latest \
          -f ./workflow/Dockerfile \
          ./workflow

    # Run deployment inside the container
    - name: Deploy to GKE
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        GCP_REGION: ${{ env.GCP_REGION }}
        GKE_ZONE: ${{ env.GKE_ZONE }}
        POSTGRE_HOST: ${{ secrets.POSTGRE_HOST }}
        POSTGRE_USER: ${{ secrets.POSTGRE_USER }}
        POSTGRE_PASSWORD: ${{ secrets.POSTGRE_PASSWORD }}
        APP_DB_NAME: ${{ secrets.APP_DB_NAME }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CERT_EMAIL: ${{ secrets.CERT_EMAIL }}
        DOMAIN_FILTER: ${{ secrets.DOMAIN_FILTER }}
        SKIP_INGRESS: ${{ github.event.inputs.skip_ingress }}
      run: |
        # Write GCP credentials to temp file
        echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp-key.json

        # Run deployment in container
        docker run --rm \
          -e GCP_PROJECT="${GCP_PROJECT}" \
          -e GCP_REGION="${GCP_REGION}" \
          -e GKE_ZONE="${GKE_ZONE}" \
          -e POSTGRE_HOST="${POSTGRE_HOST}" \
          -e POSTGRE_USER="${POSTGRE_USER}" \
          -e POSTGRE_PASSWORD="${POSTGRE_PASSWORD}" \
          -e APP_DB_NAME="${APP_DB_NAME}" \
          -e CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN}" \
          -e CERT_EMAIL="${CERT_EMAIL}" \
          -e DOMAIN_FILTER="${DOMAIN_FILTER}" \
          -e GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-key.json \
          -v /tmp/gcp-key.json:/secrets/gcp-key.json:ro \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v ${{ github.workspace }}/backend:/backend:ro \
          workflow:latest \
          bash -c "
            # Authenticate with GCP
            gcloud auth activate-service-account --key-file=/secrets/gcp-key.json
            gcloud config set project \${GCP_PROJECT}
            gcloud auth configure-docker \${GCP_REGION}-docker.pkg.dev --quiet

            # Run deploy
            cd /app/deploy
            python run.py --action deploy
          "

        # Cleanup
        rm -f /tmp/gcp-key.json
