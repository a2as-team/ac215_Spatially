<script type="text/ng-template" id="mccExpTocNodeSelectorTemplate1">
    <button data-ng-if="::node.Children.length" class="expToc-expander btn btn-link" style="float:left; width:42px;" aria-expanded="{{!!node.showChildren}}" aria-controls="child-nodes-{{::node.Id}}">
        <i data-ng-class="node.showChildren ? 'fa fa-minus' : 'fa fa-plus'"></i>
        <span class="visually-hidden">{{!!node.showChildren ? "Collapse" : "Expand"}} {{::node.Heading}}</span>
    </button>
    <button ng-style="{ 'margin-left': !node.Children.length ? '42px' : '0px', 'display': node.Children.length ? 'inline-block' : 'block'}" class="expToc-selector button-unstyled" role="checkbox" aria-checked="{{!!node.isSelected}}" mcc-aria-disabled="node.isDisabled">
        <i data-ng-class="node.isSelected ? 'fa fa-check-square-o' : 'fa fa-square-o'"></i>
        <span data-ng-bind="::node.Heading"></span>
        <span class="label label-primary" data-ng-if="::node.Data.isAmended == true">Amended</span>
        <span class="label label-primary" data-ng-if="::node.Data.isUpdated == true">Updated</span>
    </button>
    <button class="btn btn-flat btn-link btn-link-inline"
        style="display: inline-block; padding: 0px;"
        data-ng-if="(node.Children.length) && (expToc.mode === 'manual-selector')"
        data-ng-class="{'text-primary': true, 'expToc-select-all': ((getSelectedChildNodes(node) || []).length < node.Children.length), 'expToc-reset-select': ((getSelectedChildNodes(node) || []).length == node.Children.length) }"
        aria-label="{{((getSelectedChildNodes(node) || []).length < node.Children.length)  ? 'SELECT ALL' : 'RESET'}} {{::node.Heading}} content and all descendents content">
        {{((getSelectedChildNodes(node) || []).length < node.Children.length) ? 'SELECT ALL' : 'RESET'}}
    </button>
    <ul id="child-nodes-{{::node.Id}}" data-ng-if="node.showChildren" style="margin-left:20px;" class="nav nav-pills nav-stacked gen-toc-nav">
        <li once once-attr-data-nodeid="node.Id" data-ng-repeat="node in node.Children track by node.Id" data-ng-include="'mccExpTocNodeSelectorTemplate1'">
        </li>
    </ul>
</script>
