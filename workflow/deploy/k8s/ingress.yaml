apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spatially-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${INGRESS_HOST}
      secretName: spatially-tls
  rules:
    - host: ${INGRESS_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spatially-backend
                port:
                  number: 80
