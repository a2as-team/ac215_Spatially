name: Lightweight Data Collection Tests

on:
  push:
    branches: [ main, feat/*, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-data-lightweight:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Set up Python
      run: uv python install 3.13

    - name: Install dependencies
      run: uv sync --all-packages
      working-directory: ./data

    - name: Run lightweight tests (excluding transcription)
      run: |
        for test_file in tests/test_*.py; do
          if [[ "$test_file" != "tests/test_transcribe.py" ]]; then
            uv run python -m unittest "${test_file%.py//\//.}" -v
          fi
        done
      working-directory: ./data
