# PIPELINE DEFINITION
# Name: collector-zoning-ordinance-pipeline-chicago
components:
  comp-zoning-ordinance-collector-component:
    executorLabel: exec-zoning-ordinance-collector-component
deploymentSpec:
  executors:
    exec-zoning-ordinance-collector-component:
      container:
        command:
        - sh
        - -c
        - export GCS_BUCKET_NAME=spatially-data && export GCP_PROJECT=spatially-476017
          && /home/app/.venv/bin/python /app/zoning_ordinance/run.py --city 'chicago'
          --headless true --download_dir '/app/downloads/zoning_ordinance/chicago'
        image: us-central1-docker.pkg.dev/spatially-476017/workflow-images/data-collector:latest
        resources:
          cpuLimit: 2.0
          memoryLimit: 8.0
          resourceCpuLimit: 2000m
          resourceMemoryLimit: 8G
pipelineInfo:
  name: collector-zoning-ordinance-pipeline-chicago
root:
  dag:
    tasks:
      zoning-ordinance-collector-component:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-zoning-ordinance-collector-component
        taskInfo:
          name: collector-zoning-ordinance-chicago
schemaVersion: 2.1.0
sdkVersion: kfp-2.14.6
