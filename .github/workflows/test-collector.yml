name: Lightweight Collector Tests

on:
  push:
    branches: [ main, feat/*, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-data-lightweight:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Set up Python
      run: uv python install 3.13

    - name: Install dependencies
      run: uv sync 
      working-directory: ./data/collector

    - name: Run all tests except heavy tests
      run: |
        # Define tests to exclude (require GPU, Selenium, or are too heavy for CI)
        EXCLUDE_TESTS=(
          # Add more heavy tests here as needed, e.g.:
          # "test_some_other_gpu_test.py"
        )

        # Build exclude pattern for find command
        EXCLUDE_PATTERN=""
        for test in "${EXCLUDE_TESTS[@]}"; do
          EXCLUDE_PATTERN="$EXCLUDE_PATTERN -not -name $test"
        done

        # Find and run all tests except excluded ones
        find tests -name "test_*.py" $EXCLUDE_PATTERN | while read test_file; do
          # Convert path to module format: tests/test_zba_boston.py -> tests.test_zba_boston
          test_module=$(echo "$test_file" | sed 's/\//./g' | sed 's/\.py$//')
          echo "Running $test_module"
          uv run python -m unittest "$test_module" -v
        done
      working-directory: ./data/collector
