  set_defaults_from_env:
    type: sync
    module: backend.app.core.config
    args: [self]
    params:
      returns: Self
  set_history:
    type: sync
    module: backend.app.agents.smart_data_agent.runner
    args: [self, history]
  setup_all:
    type: sync
    module: workflow.deploy.k8s.secrets
    args: [self]
  setup_cloudflare_secrets:
    type: sync
    module: workflow.deploy.k8s.secrets
    args: [self]
  setup_db_secrets:
    type: sync
    module: workflow.deploy.k8s.secrets
    args: [self]
  setup_gcp_sa_key_secret:
    type: sync
    module: workflow.deploy.k8s.secrets
    args: [self]
  setup_gcp_secrets:
    type: sync
    module: workflow.deploy.k8s.secrets
    args: [self]
  start_chat:
    type: async
    module: backend.app.api.routes.v1.chat
    args: [request, x_session_id]
  status:
    type: sync
    module: workflow.deploy.k8s.secrets
    args: [self]
  switch_to_city_mode:
    type: async
    module: backend.app.agents.smart_data_agent.runner
    args: [self]
  switch_to_location_mode:
    type: async
    module: backend.app.agents.smart_data_agent.runner
    args: [self, latitude, longitude]
  train:
    type: sync
    module: llm.development_plans.NER.package.trainer.train
    args: [self, batch_size, epochs, learning_rate, json_path, downsample_no_entities]
  wait_for_deployment:
    type: sync
    module: workflow.deploy.scripts.gke_deploy
    args: [self, deployment_name]

