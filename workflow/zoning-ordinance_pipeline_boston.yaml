# PIPELINE DEFINITION
# Name: zoning-ordinance-pipeline-boston
components:
  comp-zoning-ordinance-chunk-embed-component:
    executorLabel: exec-zoning-ordinance-chunk-embed-component
  comp-zoning-ordinance-collector-component:
    executorLabel: exec-zoning-ordinance-collector-component
  comp-zoning-ordinance-load-component:
    executorLabel: exec-zoning-ordinance-load-component
deploymentSpec:
  executors:
    exec-zoning-ordinance-chunk-embed-component:
      container:
        command:
        - sh
        - -c
        - export GCS_BUCKET_NAME=spatially-data && export GCP_PROJECT=spatially-476017
          && /home/app/.venv/bin/python /app/zoning_ordinance_chunk_embed/run.py --city
          'boston'
        image: us-central1-docker.pkg.dev/spatially-476017/workflow-images/zoning-ordinance-chunk-embed:latest
        resources:
          cpuLimit: 4.0
          memoryLimit: 16.0
          resourceCpuLimit: 4000m
          resourceMemoryLimit: 16G
    exec-zoning-ordinance-collector-component:
      container:
        command:
        - sh
        - -c
        - export GCS_BUCKET_NAME=spatially-data && export GCP_PROJECT=spatially-476017
          && /home/app/.venv/bin/python /app/zoning_ordinance/run.py --city 'boston'
          --headless true --download_dir '/app/downloads/zoning_ordinance/boston'
        image: us-central1-docker.pkg.dev/spatially-476017/workflow-images/data-collector:latest
        resources:
          cpuLimit: 2.0
          memoryLimit: 8.0
          resourceCpuLimit: 2000m
          resourceMemoryLimit: 8G
    exec-zoning-ordinance-load-component:
      container:
        command:
        - sh
        - -c
        - export GCS_BUCKET_NAME=spatially-data && export GCP_PROJECT=spatially-476017
          && export MILVUS_PUBLIC_ENDPOINT= && export MILVUS_API_KEY= && /home/app/.venv/bin/python
          /app/zoning_ordinance_load/run.py --city 'boston' --collection 'zoning-ordinance'
        image: us-central1-docker.pkg.dev/spatially-476017/workflow-images/zoning-ordinance-load:latest
        resources:
          cpuLimit: 1.0
          memoryLimit: 4.0
          resourceCpuLimit: 1000m
          resourceMemoryLimit: 4G
pipelineInfo:
  name: zoning-ordinance-pipeline-boston
root:
  dag:
    tasks:
      zoning-ordinance-chunk-embed-component:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-zoning-ordinance-chunk-embed-component
        dependentTasks:
        - zoning-ordinance-collector-component
        taskInfo:
          name: processor-zoning-ordinance-chunk-embed-boston
      zoning-ordinance-collector-component:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-zoning-ordinance-collector-component
        taskInfo:
          name: collector-zoning-ordinance-boston
      zoning-ordinance-load-component:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-zoning-ordinance-load-component
        dependentTasks:
        - zoning-ordinance-chunk-embed-component
        taskInfo:
          name: processor-zoning-ordinance-load-boston
schemaVersion: 2.1.0
sdkVersion: kfp-2.14.6
