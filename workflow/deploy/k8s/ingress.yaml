apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spatially-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - zoning-api.teamspatially.com
      secretName: zoning-api-tls
  rules:
    - host: zoning-api.teamspatially.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spatially-backend
                port:
                  number: 80
