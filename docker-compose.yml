version: "3.8"

services:
  collector:
    platform: linux/amd64
    build:
      context: ./data/collector
      dockerfile: Dockerfile
      additional_contexts:
        shared_config: ./shared_config
    container_name: spatially_collector
    stdin_open: true # Keep stdin open (docker run -i)
    tty: true # Allocate a pseudo-TTY (docker run -t)
    env_file:
      - ./secrets/ac215-spatially-project.env
      - ./secrets/ac215-spatially-aws-postgres-db.env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/ac215-spatially-storage-accessor-keys.json
      PYTHONPATH: /app:/
    volumes:
      - ./secrets:/secrets:ro # This will mount our ./secrets as /secrets in the container
      - ./shared_config:/app/shared_config:ro # Shared configuration across all services
      - ./data/collector:/app # This will mount our ./data/collector as /app in the container

  processor:
    platform: linux/amd64
    build:
      context: ./data/processor
      dockerfile: Dockerfile
      additional_contexts:
        shared_config: ./shared_config
    container_name: spatially_processor
    stdin_open: true # Keep stdin open (docker run -i)
    tty: true # Allocate a pseudo-TTY (docker run -t)
    env_file:
      - ./secrets/ac215-spatially-project.env
      - ./secrets/ac215-spatially-aws-postgres-db.env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/ac215-spatially-pipeline-accessor-keys.json
      PYTHONPATH: /app:/
    volumes:
      - ./secrets:/secrets:ro # This will mount our ./secrets as /secrets in the container
      - ./shared_config:/app/shared_config:ro # Shared configuration across all services
      - ./data/processor:/app # This will mount our ./data/processor as /app in the container
      - ./llm:/app/llm:ro # Mount llm directory for NER predictor imports

  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: label_studio_development_plans
    ports:
      - "8080:8080"
      # To the label-studio frontend the host for accessing the label studio backend will be
      # http://label-studio-ml-backend:9090
    env_file:
      - ./secrets/ac215-spatially-aws-postgres-db.env
      - ./secrets/ac215-spatially-labelstudio-db.env
    environment:
      # PostgreSQL Database Configuration
      - DJANGO_DB=default
      # Local file serving for PDFs (for fallback, not used with GCS)
      # - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      # - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/files
      # Google Cloud Storage Configuration
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/ac215-spatially-storage-accessor-keys.json
    volumes:
      - ./data/downloads/development_plans:/label-studio/files:ro
      - development_plans_label_studio_data:/label-studio/data
      - ./secrets:/secrets:ro
    networks:
      - development_plans_label_studio_network
    command: label-studio --host 0.0.0.0

  label-studio-ml-backend:
    container_name: label-studio-ml-backend
    build:
      context: ./label_studio/label_studio_development_plans_backend
      dockerfile: Dockerfile
    init: true
    # build:
    #   context: ./label_studio/label-studio-ml-backend/label_studio_ml/examples/huggingface_ner
    #   args:
    #     TEST_ENV: ${TEST_ENV}
    environment:
      # If you are using this model for training, you have to connect it to Label Studio
      - LABEL_STUDIO_HOST=http://label-studio:8080
      - LABEL_STUDIO_API_KEY=your-api-key
      # Use any model for [AutoModelForSequenceClassification](https://huggingface.co/transformers/v3.0.2/model_doc/auto.html#automodelforsequenceclassification)
      - BASELINE_MODEL_NAME=nlpaueb/legal-bert-base-uncased
      # change it to this model if you want to run training
      # - BASELINE_MODEL_NAME=distilbert/distilbert-base-uncased
      # The model directory for the fine-tuned checkpoints (relative to $MODEL_DIR)
      - FINETUNED_MODEL_NAME=ner_model_for_development_plans
      # The number of labeled tasks to download from Label Studio before starting training
      - START_TRAINING_EACH_N_UPDATES=1
      # Learning rate
      - LEARNING_RATE=2e-5
      # Number of epochs
      - NUM_TRAIN_EPOCHS=3
      # Weight decay
      - WEIGHT_DECAY=0.01
      # specify these parameters if you want to use basic auth for the model server
      - BASIC_AUTH_USER=
      - BASIC_AUTH_PASS=
      # set the log level for the model server
      - LOG_LEVEL=DEBUG
      # any other parameters that you want to pass to the model server
      - ANY=PARAMETER
      # specify the number of workers and threads for the model server
      - WORKERS=1
      - THREADS=8
      # specify the model directory (likely you don't need to change this)
      - MODEL_DIR=/data/models
    ports:
      - "9090:9090"
    volumes:
      - "./label_studio/tmp/label_studio_development_plans_backend/server:/data"
      - "./label_studio/tmp/label_studio_development_plans_backend/.cache:/root/.cache"
    networks:
      - development_plans_label_studio_network

  workflow:
    build:
      context: ./workflow
      dockerfile: Dockerfile
      additional_contexts:
        shared_config: ./shared_config
    container_name: spatially_workflow
    stdin_open: true
    tty: true
    env_file:
      - ./secrets/ac215-spatially-project.env
      - ./secrets/ac215-deploy.env
      # - ./secrets/ac215-spatially-finetune.env # this is for the finetune job (optional)
      # - ./secrets/ac215-spatially-milvus-vectordb.env # Milvus credentials
      - ./secrets/ac215-spatially-aws-postgres-db.env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/ac215-spatially-pipeline-accessor-keys.json
      DOCKER_API_VERSION: "1.43"  # Match Docker socket API version
    volumes:
      - ./secrets:/secrets:ro
      - ./shared_config:/app/shared_config:ro # Shared configuration across all services
      - ./workflow:/app
      # - ./data:/app/data
      - ./data:/app/data
      # Mount Docker socket to allow publishing images from within container
      - /var/run/docker.sock:/var/run/docker.sock
      - ./llm:/app/llm
      - ./backend:/backend:ro  # For building backend image

  llm_development_plans_trainer:
    build:
      context: ./llm/development_plans/NER
      dockerfile: Dockerfile
    container_name: development_plans_ner_trainer
    stdin_open: true
    tty: true
    env_file:
      - ./secrets/ac215-spatially-project.env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/ac215-spatially-storage-accessor-keys.json
    volumes:
      - ./llm/development_plans/NER:/app
      - ./secrets:/secrets:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spatially_backend
    ports:
      - "8000:8000"
    env_file:
      - ./secrets/ac215-spatially-project.env
      - ./secrets/ac215-spatially-aws-postgres-db.env
    environment:
      PYTHONPATH: /app
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/ac215-spatially-pipeline-accessor-keys.json
    volumes:
      - ./backend:/app
      - ./secrets:/secrets:ro
    command: ["uv", "run", "fastapi", "dev", "--host", "0.0.0.0", "--port", "8000", "app/main.py"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spatially_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - SERVER_API_BASE_URL=http://backend:8000
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  # This is a volume that is stored in the host machine (It is managed by Docker, not the user local machine)
  development_plans_label_studio_data:
    driver: local

networks:
  development_plans_label_studio_network:
    driver: bridge
