name: Build and Deploy to GKE

on:
  push:
    branches: [ ] # TODO: Change to the branch you want to deploy to
  # Manual trigger with environment selection
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - prod

env:
  GCP_REGION: us-central1
  GKE_CLUSTER: spatially-cluster  # Change to your cluster name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Set environment based on trigger
    environment: ${{ github.event.inputs.environment || 'prod' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Authenticate to Google Cloud
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    # Setup gcloud CLI
    - name: Setup gcloud CLI
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT }}

    # Configure Docker to use gcloud as credential helper
    - name: Configure Docker
      run: |
        gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

    # Build and push backend image
    - name: Build and Push Backend Image
      run: |
        IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/workflow-images/backend"
        docker build \
          --platform linux/amd64 \
          --build-context shared_config=./shared_config \
          -t ${IMAGE_URI}:${{ github.sha }} \
          -t ${IMAGE_URI}:latest \
          -f ./backend/Dockerfile \
          ./backend
        docker push ${IMAGE_URI}:${{ github.sha }}
        docker push ${IMAGE_URI}:latest

    # Get GKE credentials
    - name: Get GKE Credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GCP_REGION }}

    # Install Helm
    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: 'latest'

    # Deploy to GKE
    - name: Deploy to GKE
      working-directory: ./workflow/k8s
      env:
        GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        GCP_REGION: ${{ env.GCP_REGION }}
        IMAGE_TAG: ${{ github.sha }}
        POSTGRE_HOST: ${{ secrets.POSTGRE_HOST }}
        POSTGRE_PASSWORD: ${{ secrets.POSTGRE_PASSWORD }}
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
      run: |
        ./deploy.sh ${{ github.event.inputs.environment || 'prod' }}

    # Verify deployment
    - name: Verify Deployment
      run: |
        kubectl rollout status deployment/spatially --timeout=300s
        kubectl get pods -l app.kubernetes.io/name=spatially
