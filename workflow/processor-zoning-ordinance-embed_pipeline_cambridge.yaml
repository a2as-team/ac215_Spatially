      container:
        command:
        - sh
        - -c
        - export GCS_BUCKET_NAME=spatially-data && export GCP_PROJECT=spatially-476017
          && export GCP_REGION=us-central1 && export APP_DB_NAME=app && export POSTGRE_USER=postgres
          && export POSTGRE_PASSWORD=spatially4ever! && export POSTGRE_HOST=spatially-db.cor0jg0kbkom.us-east-1.rds.amazonaws.com
          && export POSTGRE_PORT=5432 && /home/app/.venv/bin/python /app/zoning_ordinance_embed/run.py
          --city 'cambridge'
        image: us-central1-docker.pkg.dev/spatially-476017/workflow-images/zoning-ordinance-embed:latest
        resources:
          cpuLimit: 2.0
          memoryLimit: 8.0
          resourceCpuLimit: 2000m
