        resources:
          cpuLimit: 2.0
          memoryLimit: 8.0
          resourceCpuLimit: 2000m
          resourceMemoryLimit: 8G
pipelineInfo:
  name: processor-zoning-ordinance-chunk-embed-pipeline-boston
root:
  dag:
    tasks:
      zoning-ordinance-chunk-embed-component:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-zoning-ordinance-chunk-embed-component
        taskInfo:
