files:
  .tar:
    type: literal
    actions: [read]
    params:
      caller: [package_and_upload]
      path: [temp_path]
  .tar.gz:
    type: literal
    actions: [read]
    params:
      caller: [package_and_upload]
      path: [temp_path]
  /llm/development_plans/NER/package:
    type: literal
    actions: [read]
    params:
      caller: [_ensure_predictor_loaded]
  deployment.yaml:
    type: literal
    actions: [read]
    params:
      caller: [deploy_deployment_and_service]
      path: [K8S_DIR]
  hpa.yaml:
    type: literal
    actions: [read]
    params:
      caller: [deploy_deployment_and_service]
      path: [K8S_DIR]
  json_path:
    type: variable
    actions: [read]
    params:
      caller: [open, json.load]
      alias: [f]
  llm_path:
    type: literal
    actions: [read]
    params:
      caller: [Path('/llm/development_plans/NER/package')]
  local_file:
    type: variable
    actions: [write]
    params:
      caller: [local_file.parent.mkdir]
  local_path:
    type: variable
    actions: [write]
    params:
      caller: [local_path.mkdir]
  pvc.yaml:
    type: literal
    actions: [read]
    params:
      caller: [deploy_deployment_and_service]
      path: [K8S_DIR]
  service.yaml:
    type: literal
    actions: [read]
    params:
      caller: [deploy_deployment_and_service]
      path: [K8S_DIR]
  temp_dir:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  temp_path:
    type: literal
    actions: [read]
    params:
      caller: [Path(temp_dir)]
  tmp/ner_model_inference:
    type: literal
    actions: [read]
    params:
      caller: [_download_model_from_gcs]
  tmp/sample-bpda-data.json:
    type: literal
    actions: [read]
    params:
      caller: [import_label_studio_data_from_single_json]

processes:
  gsutil:
    type: shell
    actions: [exec]
    args: [[cp, str(tar_gz_file), 'gs://{...}/{...}']]
    params:
      caller: [subprocess.run]
      shell: ["False"]
  gzip:
    type: shell
    actions: [exec]
    args: [[str(tar_file)]]
    params:
      caller: [subprocess.run]
      shell: ["False"]
  tar:
    type: shell
    actions: [exec]
    args: [[cvf, str(tar_file), -C, str(package_dir), "."]]
    params:
      caller: [subprocess.run]
      shell: ["False"]

networks:
  zoning.:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://zoning.{domain_filter}
      caller: [setup_gcp_secrets]
